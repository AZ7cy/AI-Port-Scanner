name: Feature request
description: Suggest a new feature or an improvement to an existing one.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please check the existing issues first to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what makes it difficult today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature or change you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Nmap scanning
        - Socket scanning (Full Detail)
        - Advanced tools (OS, firewall, honeypot, traceroute)
        - AI analysis (Ollama)
        - Anomaly detection
        - Report export
        - Settings
        - User interface
        - Build or executable
        - Other

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues, and this feature has not been requested yet.
          required: true
        - label: This feature is meant for authorized security testing, network administration, or learning.
          required: true
